<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHub</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="chat-container">
        <!-- ======================================== -->
        <!-- HEADER -->
        <!-- ======================================== -->
        <header class="chat-header">
            <div class="header-left">
                <span class="brand">💬 ChatHub</span>
                <span class="room-badge"># <span id="currentRoomName">general</span></span>
            </div>
            <div class="header-right">
                <button class="icon-btn">👤</button>
                <button class="icon-btn logout">🚪</button>
            </div>
        </header>

        <!-- ======================================== -->
        <!-- MAIN -->
        <!-- ======================================== -->
        <div class="chat-main">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <!-- User Profile -->
                <div class="user-profile">
                    <div class="user-avatar">👤</div>
                    <div class="user-info">
                        <div class="user-name">temuriy</div>
                        <div class="user-status">
                            <span class="status-dot"></span> Online
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Room List -->
                <div class="room-list">
                    <div class="room-list-header">
                        <span>Xonalar</span>
                        <span class="room-count">3</span>
                    </div>

                    <button class="room-item active" data-room="general">
                        <span class="room-icon">#</span>
                        <span class="room-name">general</span>
                        <span class="room-badge">12</span>
                    </button>

                    <button class="room-item" data-room="random">
                        <span class="room-icon">🎲</span>
                        <span class="room-name">random</span>
                        <span class="room-badge">5</span>
                    </button>

                    <button class="room-item" data-room="help">
                        <span class="room-icon">❓</span>
                        <span class="room-name">help</span>
                        <span class="room-badge">3</span>
                    </button>
                </div>
            </aside>

            <!-- MESSAGES -->
            <main class="messages-area">
                <div class="messages-container">
                    <!-- Xabarlar -->
                    <div class="message other">
                        <div class="msg-avatar">G</div>
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">gay</span>
                                <span class="msg-time">19:24:18</span>
                            </div>
                            <div class="msg-text">gay</div>
                        </div>
                    </div>

                    <div class="message own">
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">Siz</span>
                                <span class="msg-time">19:24:42</span>
                            </div>
                            <div class="msg-text">hi</div>
                        </div>
                    </div>

                    <div class="message own">
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">Siz</span>
                                <span class="msg-time">19:27:27</span>
                            </div>
                            <div class="msg-text">salom</div>
                        </div>
                    </div>

                    <div class="message other">
                        <div class="msg-avatar">G</div>
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">gay</span>
                                <span class="msg-time">19:35:27</span>
                            </div>
                            <div class="msg-text">salom</div>
                        </div>
                    </div>

                    <div class="message own">
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">Siz</span>
                                <span class="msg-time">19:45:35</span>
                            </div>
                            <div class="msg-text">salom</div>
                        </div>
                    </div>

                    <div class="message other">
                        <div class="msg-avatar">G</div>
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">gay</span>
                                <span class="msg-time">19:49:10</span>
                            </div>
                            <div class="msg-text">salom</div>
                        </div>
                    </div>

                    <div class="message own">
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">Siz</span>
                                <span class="msg-time">20:35:28</span>
                            </div>
                            <div class="msg-text">ggwp</div>
                        </div>
                    </div>

                    <div class="message other">
                        <div class="msg-avatar">G</div>
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">gay</span>
                                <span class="msg-time">20:37:08</span>
                            </div>
                            <div class="msg-text">salom</div>
                        </div>
                    </div>

                    <div class="message own">
                        <div class="msg-content">
                            <div class="msg-meta">
                                <span class="msg-name">Siz</span>
                                <span class="msg-time">20:37:46</span>
                            </div>
                            <div class="msg-text">salom</div>
                        </div>
                    </div>
                </div>

                <!-- INPUT -->
                <div class="chat-input">
                    <input type="text" placeholder="Xabar yozing...">
                    <button class="send-btn">➤</button>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
